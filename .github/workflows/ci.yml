name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall app.py grp_calculator.py project_store.py tests

  api-tests:
    name: API service tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/api
        env:
          API_REPOSITORY: memory
        run: python -m pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/web
        run: npm ci

      - name: Build frontend
        working-directory: packages/web
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - tests
      - api-tests
      - frontend-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mediapulse:ci .

      - name: Build API image
        run: docker build -t mediapulse-api:ci -f services/api/Dockerfile .
